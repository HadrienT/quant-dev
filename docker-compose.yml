# The Streamlit app only. Data ingestion and the Postgres it reads from moved
# to the data-ingest repository, which owns the database.
#
#   docker compose up -d          http://127.0.0.1:8501
#
# The app joins data-ingest's compose network and reaches Postgres by service
# name, so the database needs no port published beyond the host loopback.
# Start data-ingest's stack first.

services:
  visualization:
    build:
      context: ./visualization
    image: quant-dev/visualization:latest
    container_name: quant-dev-visualization
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-dataingest}
      PGUSER: ${PGUSER:-dataingest}
      PGPASSWORD: ${PGPASSWORD:?PGPASSWORD must be set in .env}
      FRED_API_KEY: ${FRED_API_KEY:-}
    ports:
      - "127.0.0.1:8501:8080"
    networks:
      - data-ingest

networks:
  data-ingest:
    external: true
    name: data-ingest_default
