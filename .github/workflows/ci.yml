name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: GetData tests
    runs-on: ubuntu-latest

    # The ingestion writes to Postgres now, so the integration suite runs
    # against a real database instead of a shared BigQuery test dataset.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quantdev
          POSTGRES_USER: quantdev
          POSTGRES_PASSWORD: quantdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantdev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: quantdev
      PGUSER: quantdev
      PGPASSWORD: quantdev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: ./GetData
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.in

      # Network-marked tests call the live yfinance API, which is rate limited
      # and changes its response shape without notice. They are for local runs.
      - name: Run tests
        working-directory: ./GetData
        run: pytest -m "not network" --disable-warnings

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: flake8 ./GetData ./scripts
